name: Release

on:
  push:
    tags:
      - "v*-alpha.*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified CLI package to npm
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    environment: npm-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: npm install --global npm@11.5.1
      - run: pnpm release:verify
      - name: Verify release identity
        shell: bash
        run: |
          version="$(node -p "require('./version.json').version")"
          test "${GITHUB_REF}" = "refs/tags/v${version}"
          test "$(node -p "require('./packages/cli/package.json').version")" = "${version}"
      - name: Publish
        if: ${{ github.event_name == 'push' || inputs.publish }}
        working-directory: packages/cli
        run: npm publish --provenance --access public --tag alpha
      - name: Verify public package
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: bash
        run: |
          version="$(node -p "require('./version.json').version")"
          for attempt in 1 2 3 4 5; do
            published="$(npm view @jayadityavetsa/patchproof@alpha version 2>/dev/null || true)"
            test "${published}" = "${version}" && break
            sleep 10
          done
          test "${published}" = "${version}"
          test "$(npx --yes @jayadityavetsa/patchproof@${version} --version)" = "${version}"
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patchproof-release-artifacts
          path: |
            artifacts/*.tgz
            artifacts/SHA256SUMS
            artifacts/patchproof-sbom.cdx.json
