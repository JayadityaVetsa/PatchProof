name: PatchProof example

on:
  pull_request:

permissions:
  contents: read

jobs:
  patchproof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Public consumers should replace this local path with a full immutable PatchProof commit SHA.
      - uses: ./
        with:
          config: .patchproof.yml
          fail-on: regression
